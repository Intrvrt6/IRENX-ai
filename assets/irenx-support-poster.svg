<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1700" viewBox="0 0 1200 1700"><rect width="1200" height="1700" fill="#07110c"/><rect x="40" y="40" width="1120" height="1620" rx="32" fill="#0d1c14" stroke="#2fe56b" stroke-width="2"/><text x="80" y="125" fill="#67f28d" font-family="Arial,sans-serif" font-size="64" font-weight="700">IRENX</text><text x="80" y="170" fill="#d7ffe2" font-family="Arial,sans-serif" font-size="24">AI • MCP • SECURITY • TRADING</text><text x="80" y="245" fill="white" font-family="Arial,sans-serif" font-size="46" font-weight="700">BANGUN MASA DEPAN AI</text><text x="80" y="300" fill="#67f28d" font-family="Arial,sans-serif" font-size="46" font-weight="700">BERSAMA IRENX.</text><text x="80" y="360" fill="#d5ded8" font-family="Arial,sans-serif" font-size="25">IRENX adalah platform AI &amp; MCP open-source yang menggabungkan</text><text x="80" y="400" fill="#d5ded8" font-family="Arial,sans-serif" font-size="25">AI, keamanan, otomasi, developer tools, dan data pasar real-time.</text><text x="80" y="440" fill="#d5ded8" font-family="Arial,sans-serif" font-size="25">Tujuannya sederhana: membuat teknologi canggih lebih mudah diakses.</text><rect x="80" y="490" width="1040" height="480" rx="24" fill="#09150f" stroke="#1e6f3b"/><text x="120" y="555" fill="#67f28d" font-family="Arial,sans-serif" font-size="34" font-weight="700">KENAPA IRENX?</text><text x="120" y="620" fill="white" font-family="Arial,sans-serif" font-size="27" font-weight="700">AI ROUTING CERDAS</text><text x="120" y="655" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="22">Memilih dan menghubungkan model AI berdasarkan kebutuhan.</text><text x="120" y="715" fill="white" font-family="Arial,sans-serif" font-size="27" font-weight="700">MCP TOOLS POWERFUL</text><text x="120" y="750" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="22">Menghubungkan AI dengan data, API, library, cloud, dan tools.</text><text x="120" y="810" fill="white" font-family="Arial,sans-serif" font-size="27" font-weight="700">SECURITY FIRST</text><text x="120" y="845" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="22">RBAC, policy, audit, secrets, observability, dan supply-chain security.</text><text x="120" y="905" fill="white" font-family="Arial,sans-serif" font-size="27" font-weight="700">TRADING &amp; REAL-TIME DATA</text><text x="120" y="940" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="22">Data pasar dan analisis sebagai evidence layer yang terkontrol.</text><text x="80" y="1040" fill="white" font-family="Arial,sans-serif" font-size="32" font-weight="700">SUPPORT PROJECT INI</text><text x="80" y="1085" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="23">IRENX dibangun dengan waktu, riset, dan dedikasi.</text><text x="80" y="1120" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="23">Dukunganmu membantu pengembangan fitur, server, keamanan,</text><text x="80" y="1155" fill="#c8d4cc" font-family="Arial,sans-serif" font-size="23">tools open-source, dan infrastruktur project.</text><rect x="690" y="1010" width="350" height="350" rx="20" fill="white"/><g><rect x="714" y="1034" width="8" height="8"/><rect x="730" y="1034" width="8" height="8"/><rect x="746" y="1034" width="8" height="8"/><rect x="762" y="1034" width="8" height="8"/><rect x="778" y="1034" width="8" height="8"/><rect x="794" y="1034" width="8" height="8"/><rect x="810" y="1034" width="8" height="8"/><rect x="826" y="1034" width="8" height="8"/><rect x="842" y="1034" width="8" height="8"/><rect x="858" y="1034" width="8" height="8"/><rect x="874" y="1034" width="8" height="8"/><rect x="890" y="1034" width="8" height="8"/><rect x="906" y="1034" width="8" height="8"/><rect x="922" y="1034" width="8" height="8"/><rect x="938" y="1034" width="8" height="8"/><rect x="954" y="1034" width="8" height="8"/><rect x="970" y="1034" width="8" height="8"/><rect x="986" y="1034" width="8" height="8"/><rect x="1002" y="1034" width="8" height="8"/><rect x="1018" y="
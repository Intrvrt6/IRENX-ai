name: IRENX Cloudflare Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irenx-cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: irenx-prime-ai
  DEPLOY_DIR: .

jobs:
  deploy:
    name: Deploy IRENX to Cloudflare Pages
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment secrets
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CF_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN repository secret'; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID repository secret'; exit 1; }

      - name: Verify static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -s index.html
          echo "IRENX frontend found: $(wc -c < index.html) bytes"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true

      - name: Install Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npm install --global wrangler@4
          wrangler --version

      - name: Ensure Cloudflare Pages project exists
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! wrangler pages project list --format json | grep -Fq '"name":"'"$CLOUDFLARE_PAGES_PROJECT"'"'; then
            wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch main
          else
            echo "Cloudflare Pages project already exists: $CLOUDFLARE_PAGES_PROJECT"
          fi

      - name: Deploy IRENX
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler pages deploy "$DEPLOY_DIR" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main

      - name: Deployment summary
        shell: bash
        run: |
          echo 'IRENX Cloudflare Pages deployment completed.'
          echo "Project: $CLOUDFLARE_PAGES_PROJECT"
          echo "Commit: $GITHUB_SHA"

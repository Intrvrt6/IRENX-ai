name: IRENX Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irenx-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          # Do not enable npm cache until a lockfile is committed.
          # setup-node cache mode requires package-lock.json/npm-shrinkwrap/yarn.lock.

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'ERROR: GitHub Actions secret CLOUDFLARE_API_TOKEN is unavailable to this workflow.'
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'ERROR: GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is unavailable to this workflow.'
            exit 1
          fi
          echo 'Cloudflare deployment credentials are available.'

      - name: Validate Worker configuration
        run: npx wrangler deploy --dry-run

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsS --connect-timeout 5 --max-time 15 https://ai.irenx.com/api/health; then
              echo
              if curl -fsS --connect-timeout 5 --max-time 15 https://ai.irenx.com/api/infra/cloudflare; then
                echo
                echo 'IRENX production health checks passed.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production health check failed.'
          exit 1

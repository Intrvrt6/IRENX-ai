name: IRENX Cloudflare Deploy

on:
  workflow_run:
    workflows: ["IRENX CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irenx-cloudflare-production
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'ERROR: CLOUDFLARE_API_TOKEN unavailable.'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'ERROR: CLOUDFLARE_ACCOUNT_ID unavailable.'; exit 1; }
          echo 'Cloudflare deployment credentials are available.'

      - name: Validate Worker configuration
        run: npx wrangler deploy --dry-run

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..12}; do
            if curl -fsS --connect-timeout 5 --max-time 15 https://ai.irenx.com/api/health; then
              echo
              if curl -fsS --connect-timeout 5 --max-time 15 https://ai.irenx.com/api/infra/cloudflare; then
                echo
                echo 'IRENX production health checks passed.'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Production health check failed.'
          exit 1

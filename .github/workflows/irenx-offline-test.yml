name: IRENX Offline Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-test:
    name: Test offline brain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate offline files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s offline-engine.js
          test -s sw.js
          test -s offline.html
          test -s manifest.webmanifest
          grep -q 'IRENXOfflineBrain' offline-engine.js
          grep -q 'serviceWorker.register' index.html
          echo 'Offline files OK'
      - name: Run deterministic engine test
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node - <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('offline-engine.js','utf8');
          if (!src.includes('NO TRADE')) throw new Error('offline safety rule missing');
          if (!src.includes('IRENXOfflineBrain')) throw new Error('offline brain export missing');
          console.log('Offline engine source test PASS');
          NODE
      - name: Validate PWA shell
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'manifest.webmanifest' index.html
          grep -q 'offline-engine.js' index.html
          grep -q 'navigator.serviceWorker.register' index.html
          echo 'PWA integration PASS'

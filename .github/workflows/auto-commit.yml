name: IRENX Auto Commit

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: irenx-auto-commit-main
  cancel-in-progress: false

jobs:
  validate-and-commit:
    # Never create a second commit from this workflow's own commit.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate JSON
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.json' -not -path './node_modules/*' -print0 |
            while IFS= read -r -d '' file; do
              node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" "$file"
            done

      - name: Commit generated/normalized changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: automated validated update'
          git push origin HEAD:main

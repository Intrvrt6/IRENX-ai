name: IRENX CI/CD

run-name: IRENX ${{ github.event_name }} · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irenx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate IRENX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f api/index.ts
          test -f vercel.json
          test -f .env.example
          grep -q 'TWELVEDATA_API_KEY' .env.example
          grep -q 'Bun.serve' api/index.ts
          echo "IRENX structure OK"

      - name: Validate HTML
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<!doctype html>' index.html
          grep -q 'IRENX PRIME AI' index.html
          grep -q '/api/market' index.html
          echo "IRENX UI checks OK"

      - name: Validate gateway routes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/health' api/index.ts
          grep -q '/api/market' api/index.ts
          grep -q '/api/ws' api/index.ts
          grep -q 'TWELVEDATA_API_KEY' api/index.ts
          echo "IRENX gateway checks OK"

  deploy-preview:
    name: Deploy Preview
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          URL="$(npx --yes vercel@latest deploy --token "$VERCEL_TOKEN" --yes)"
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $URL"

      - name: Smoke test preview
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --retry 5 --retry-delay 3 --connect-timeout 10 "$DEPLOYMENT_URL/" >/dev/null
          curl --fail --retry 5 --retry-delay 3 --connect-timeout 10 "$DEPLOYMENT_URL/api/health"

  deploy-production:
    name: Deploy Production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel Production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          URL="$(npx --yes vercel@latest deploy --prod --token "$VERCEL_TOKEN" --yes)"
          echo "deployment_url=$URL" >> "$GITHUB_OUTPUT"
          echo "Production deployed: $URL"

      - name: Smoke test production
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          curl --fail --retry 8 --retry-delay 5 --connect-timeout 10 "$DEPLOYMENT_URL/" >/dev/null
          HEALTH="$(curl --fail --retry 8 --retry-delay 5 --connect-timeout 10 "$DEPLOYMENT_URL/api/health")"
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"ok":true'

      - name: Deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo '### IRENX Production Deployment'
            echo ''
            echo "- URL: $DEPLOYMENT_URL"
            echo '- Validation: passed'
            echo '- Health check: passed'
            echo '- Market-data errors must remain NO TRADE'
          } >> "$GITHUB_STEP_SUMMARY"

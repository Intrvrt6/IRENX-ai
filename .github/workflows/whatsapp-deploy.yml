name: IRENX WhatsApp Bot Deploy

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "worker/whatsapp.ts"
      - "worker/whatsapp-entry.ts"
      - "wrangler.whatsapp.toml"
      - "package.json"
      - "package-lock.json"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy WhatsApp Worker
        run: npx wrangler deploy -c wrangler.whatsapp.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

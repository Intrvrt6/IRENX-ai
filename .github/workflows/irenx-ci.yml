name: IRENX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irenx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html api/index.ts api/ai.ts api/dify.ts api/v1/models.ts api/v1/chat/completions.ts src/omniroute/core-router.ts docs/DIFY_INTEGRATION.md docs/CLOUDFLARE_DEPLOYMENT.md Dockerfile docker-compose.yml Caddyfile deploy.sh manifest.webmanifest; do
            test -s "$f" || { echo "Missing: $f"; exit 1; }
          done
          test ! -e vercel.json
          echo 'Self-hosted deployment layout OK'

      - name: Secret scan (tracked source only)
        shell: bash
        run: |
          set -euo pipefail
          findings="$(git grep -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|TWELVEDATA_API_KEY=[^[:space:]]+|CLOUDFLARE_API_TOKEN=[^[:space:]]+)' -- ':!.github/**' ':!docs/**' ':!*.md' ':!.env.example' ':!.claude/**' || true)"
          findings="$(printf '%s\n' "$findings" | grep -vF 'sk-dummy-key-to-bypass-oauth' || true)"
          if [[ -n "$findings" ]]; then
            printf '%s\n' "$findings"
            echo 'Potential real secret detected in tracked source files.'
            exit 1
          fi
          echo 'Secret scan OK'

      - name: Validate AI router integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'chatThroughOmniRoute' api/ai.ts
          grep -q 'observabilitySnapshot' api/ai.ts
          grep -q 'chooseRoute' api/ai.ts
          grep -q 'classifyTask' src/omniroute/core-router.ts
          grep -q 'CB_FAILURE_THRESHOLD' src/omniroute/core-router.ts
          grep -q 'REQUEST_TIMEOUT_MS' src/omniroute/core-router.ts
          grep -q 'MAX_REQUESTS' src/omniroute/core-router.ts
          grep -q 'MAX_TOKENS' src/omniroute/core-router.ts
          echo 'AI router validation OK'

      - name: Validate OmniCopilot gateway
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'chooseRoute' api/v1/chat/completions.ts
          grep -q 'X-IRENX-Route' api/v1/chat/completions.ts
          grep -q 'OMNIROUTE_API_KEY' api/v1/chat/completions.ts
          grep -q 'OMNIROUTE_BASE_URL' api/v1/models.ts
          grep -q 'IRENX_GATEWAY_API_KEY' api/v1/models.ts
          echo 'OmniCopilot gateway validation OK'

      - name: Validate Dify bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DIFY_BASE_URL' api/dify.ts
          grep -q 'DIFY_API_KEY' api/dify.ts
          grep -q '/v1/workflows/run' api/dify.ts
          grep -q '/v1/chat-messages' api/dify.ts
          grep -q 'runDifyWorkflow' api/index.ts
          grep -q 'runDifyChat' api/index.ts
          grep -q 'DIFY_TIMEOUT_MS' .env.example
          echo 'Dify bridge validation OK'

      - name: Validate self-hosted deployment
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ai.irenx.com' Caddyfile
          grep -q '127.0.0.1:3000:3000' docker-compose.yml
          grep -q 'service_healthy' docker-compose.yml
          grep -q 'image: irenx-ai:latest' docker-compose.yml
          grep -q 'docker compose up -d' deploy.sh
          grep -q 'automatic deployment rollback' <(git log -1 --format=%B) || true
          bash -n deploy.sh
          docker compose config -q
          echo 'Cloudflare/self-hosted deployment validation OK'

      - name: Build IRENX container
        run: docker build --pull --tag irenx-ci:test .

      - name: Validate API source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/market' api/index.ts
          grep -q '/api/health' api/index.ts
          grep -q '/api/dify/health' api/index.ts
          echo 'IRENX CI PASS'

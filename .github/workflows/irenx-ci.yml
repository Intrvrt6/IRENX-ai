name: IRENX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: irenx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html api/index.ts api/ai.ts api/dify.ts api/odoo.ts api/v1/models.ts api/v1/chat/completions.ts src/omniroute/core-router.ts mcp/irenx.ts worker/index.ts worker/platform-v2.ts worker/mcp-policy.ts worker/otel.ts worker/cost-engine.ts package.json webpack.config.cjs build/webpack-entry.js wrangler.toml docs/DIFY_INTEGRATION.md docs/CLOUDFLARE_NATIVE.md docs/ODOO_SIGNAL_JOURNAL.md docs/PLATFORM_V2_ARCHITECTURE.md docs/PLATFORM_V2_ROADMAP.md docs/SECURITY_MODEL_V2.md docs/COST_ENGINE_V2.md docs/OPERATIONS.md docs/THREAT_MODEL.md docs/SLO.md docs/RELEASE_POLICY.md manifest.webmanifest; do
            test -s "$f" || { echo "Missing: $f"; exit 1; }
          done
          test ! -e vercel.json
          echo 'IRENX source layout OK'

      - name: Secret scan
        shell: bash
        run: |
          set -euo pipefail
          findings="$(git grep -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|TWELVEDATA_API_KEY=[^[:space:]]+|CLOUDFLARE_API_TOKEN=[^[:space:]]+)' -- ':!.github/**' ':!docs/**' ':!*.md' ':!.env.example' ':!.claude/**' ':!scripts/setup-claude-omniroute.sh' || true)"
          if [[ -n "$findings" ]]; then
            printf '%s\n' "$findings"
            echo 'Potential real secret detected in tracked source files.'
            exit 1
          fi
          echo 'Secret scan OK'

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          echo 'JSON validation OK'

      - name: Validate Odoo Python and XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, py_compile, xml.etree.ElementTree as ET
          root = pathlib.Path('integrations/odoo/irenx_signal_journal')
          py_files = list(root.rglob('*.py'))
          xml_files = list(root.rglob('*.xml'))
          for path in py_files:
              py_compile.compile(str(path), doraise=True)
          for path in xml_files:
              ET.parse(path)
          print(f'Odoo syntax gate OK: {len(py_files)} Python, {len(xml_files)} XML files')
          PY

      - name: Validate AI router
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'chatThroughOmniRoute' api/ai.ts
          grep -q 'observabilitySnapshot' api/ai.ts
          grep -q 'chooseRoute' api/ai.ts
          grep -q 'classifyTask' src/omniroute/core-router.ts
          grep -q 'CB_FAILURE_THRESHOLD' src/omniroute/core-router.ts
          grep -q 'REQUEST_TIMEOUT_MS' src/omniroute/core-router.ts
          grep -q 'MAX_REQUESTS' src/omniroute/core-router.ts
          grep -q 'MAX_TOKENS' src/omniroute/core-router.ts
          echo 'AI router validation OK'

      - name: Validate OmniCopilot gateway
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'chooseRoute' api/v1/chat/completions.ts
          grep -q 'X-IRENX-Route' api/v1/chat/completions.ts
          grep -q 'OMNIROUTE_API_KEY' api/v1/chat/completions.ts
          grep -q 'OMNIROUTE_BASE_URL' api/v1/models.ts
          grep -q 'IRENX_GATEWAY_API_KEY' api/v1/models.ts
          echo 'OmniCopilot gateway validation OK'

      - name: Validate Dify bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'DIFY_BASE_URL' api/dify.ts
          grep -q 'DIFY_API_KEY' api/dify.ts
          grep -q '/v1/workflows/run' api/dify.ts
          grep -q '/v1/chat-messages' api/dify.ts
          grep -q 'runDifyWorkflow' api/index.ts
          grep -q 'runDifyChat' api/index.ts
          grep -q 'DIFY_TIMEOUT_MS' .env.example
          echo 'Dify bridge validation OK'

      - name: Validate Odoo Signal Journal
        shell: bash
        run: |
          set -euo pipefail
          test -s integrations/odoo/irenx_signal_journal/__manifest__.py
          test -s integrations/odoo/irenx_signal_journal/models/irenx_signal.py
          test -s integrations/odoo/irenx_signal_journal/security/ir.model.access.csv
          test -s integrations/odoo/irenx_signal_journal/views/irenx_signal_views.xml
          grep -q 'json/2' api/odoo.ts
          grep -q 'Authorization:.*bearer' api/odoo.ts
          grep -q 'create_from_irenx' api/odoo.ts
          grep -q 'irenx.signal' api/odoo.ts
          grep -q '/api/irenx/signal' api/index.ts
          grep -q 'IRENX_SIGNAL_INGEST_KEY' api/index.ts
          grep -q 'ODOO_SIGNAL_MODEL=irenx.signal' .env.example
          echo 'Odoo Signal Journal validation OK'

      - name: Validate MCP integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'createMcpHandler' mcp/irenx.ts
          grep -q 'registerTool' mcp/irenx.ts
          grep -q '"search"' mcp/irenx.ts
          grep -q '"fetch"' mcp/irenx.ts
          grep -q 'structuredContent' mcp/irenx.ts
          echo 'MCP integration validation OK'

      - name: Validate Cloudflare-native Worker
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'createMcpHandler' worker/index.ts
          grep -q 'McpServer' worker/index.ts
          grep -q 'registerTool' worker/index.ts
          grep -q '"search"' worker/index.ts
          grep -q '"fetch"' worker/index.ts
          grep -q 'structuredContent' worker/index.ts
          grep -q 'ai.irenx.com' wrangler.toml
          grep -q 'custom_domain = true' wrangler.toml
          grep -q 'observability' wrangler.toml
          grep -q 'OMNIROUTE_BASE_URL' worker/index.ts
          grep -q 'DIFY_BASE_URL' worker/index.ts
          echo 'Cloudflare-native Worker validation OK'

      - name: Validate Platform v2 runtime security
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IRENX_GATEWAY_API_KEY' worker/index.ts
          grep -q 'IRENX_MCP_AUTH_REQUIRED' worker/index.ts
          grep -q 'IRENX_RBAC_DEFAULT_ROLE' worker/index.ts
          grep -q 'gateway.authorize' worker/index.ts
          grep -q 'MCP' worker/index.ts
          grep -q 'trading.execute' worker/platform-v2.ts
          grep -q 'tool_not_registered' worker/platform-v2.ts
          grep -q 'UsageEvent' worker/cost-engine.ts
          grep -q 'traceId' worker/otel.ts
          echo 'Platform v2 runtime security validation OK'

      - name: Validate Cloudflare deployment workflow
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/workflows/cloudflare-deploy.yml
          grep -q 'wrangler' .github/workflows/cloudflare-deploy.yml
          grep -q 'CLOUDFLARE_API_TOKEN' .github/workflows/cloudflare-deploy.yml
          grep -q 'CLOUDFLARE_ACCOUNT_ID' .github/workflows/cloudflare-deploy.yml
          echo 'Cloudflare deployment workflow validation OK'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run production build validation
        run: npm run build

      - name: Run webpack compatibility build
        run: npm run build:webpack

      - name: Validate Wrangler dependency graph
        run: npx wrangler deploy --dry-run

      - name: Validate API source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/market' api/index.ts
          grep -q '/api/health' api/index.ts
          grep -q '/api/dify/health' api/index.ts
          echo 'IRENX CI PASS'

services:
  irenx:
    build: .
    container_name: irenx-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3000"
      CORS_ORIGIN: "https://ai.irenx.com"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - irenx

  caddy:
    image: caddy:2-alpine
    container_name: irenx-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      irenx:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--timeout=3", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - irenx

networks:
  irenx:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
